name: Auto Update ETF Data

on:
  schedule:
    # 매일 평일 장 마감 후 (한국시간 18:00 = UTC 09:00) 자동 실행
    - cron: '0 9 * * 1-5'
  workflow_dispatch: # GitHub 웹 화면에서 수동 실행 버튼 활성화

jobs:
  update-etf-data:
    runs-on: ubuntu-latest
    steps:
      - name: repository checkout
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas beautifulsoup4 requests

      - name: Run Python Data Collector
        run: |
          python fetch_data.py # 보유하고 계신 파이썬 스크립트 파일명

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/etf_data.json
          git status
          git diff-index --quiet HEAD || git commit -m "Auto update: ETF market data [$(date +'%Y-%m-%d')]"
          git push
