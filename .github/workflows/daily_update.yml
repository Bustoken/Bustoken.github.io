name: Daily ETF Data Update

on:
  schedule:
    # 매일 한국시간 기준 오전 7시(UTC 기준 전날 22시)에 자동 실행
    - cron: '0 22 * * *'
  workflow_dispatch: # 수동으로 실행시킬 수 있는 버튼 추가

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
    - name: 저장소 코드 가져오기
      uses: actions/checkout@v4

    - name: 파이썬 환경 설정
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 필요한 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        pip install yfinance pandas

    - name: ETF 데이터 수집 스크립트 실행
      run: python scripts/fetch_etf.py

    - name: 변경된 데이터 저장소에 자동 커밋
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add data/etf_data.json
        git commit -m "auto: 매일 ETF 데이터 자동 업데이트" || exit 0
        git push
