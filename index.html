<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bustoken ETF Research Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #0f172a; color: #ffffff; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-center items-center p-4">

    <!-- 1. 랜딩 페이지 -->
    <div id="landing-page" class="bg-slate-800 p-8 sm:p-10 rounded-2xl shadow-2xl text-center max-w-lg w-full border border-slate-700">
        <span class="inline-block bg-sky-900/80 text-sky-400 border border-sky-500/30 px-3 py-1 rounded-full text-xs font-semibold mb-4 uppercase">
            ● Live Platform
        </span>
        <h1 class="text-2xl sm:text-3xl font-bold text-white mb-3">Bustoken ETF Research</h1>
        <p class="text-slate-400 text-sm sm:text-base leading-relaxed mb-6">
            국내외 ETF 시장 동향 수집 및 테마별 포트폴리오 기획·마케팅 플랫폼입니다.
        </p>
        <button onclick="showDashboard()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 px-6 rounded-xl transition shadow-lg shadow-blue-500/20 active:scale-95 flex items-center justify-center gap-2">
            <span>플랫폼 입장하기</span>
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"></path></svg>
        </button>
    </div>

    <!-- 2. ETF 대시보드 화면 -->
    <div id="dashboard-page" class="hidden w-full max-w-6xl mx-auto py-6">
        <!-- 헤더 -->
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4 border-b border-slate-800 pb-5">
            <div>
                <span class="bg-blue-500/10 text-blue-400 text-xs px-2.5 py-0.5 rounded-full border border-blue-500/20 font-mono">Bustoken Research</span>
                <h2 class="text-2xl font-bold text-white mt-1">국내외 ETF 테마 & 포트폴리오 Lab</h2>
            </div>
            <button onclick="showLanding()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-2 rounded-lg border border-slate-700 transition">
                ← 홈으로
            </button>
        </div>

        <!-- 테마 필터 탭 -->
        <div class="flex gap-2 mb-6 overflow-x-auto pb-2" id="theme-tabs">
            <button onclick="filterTheme('ALL', this)" class="tab-btn px-4 py-2 rounded-lg text-xs font-semibold bg-blue-600 text-white">전체 보기</button>
            <button onclick="filterTheme('AI & 반도체/전력', this)" class="tab-btn px-4 py-2 rounded-lg text-xs font-semibold bg-slate-800 text-slate-400 hover:bg-slate-700">AI & 반도체/전력</button>
            <button onclick="filterTheme('고배당 & 금리 피봇', this)" class="tab-btn px-4 py-2 rounded-lg text-xs font-semibold bg-slate-800 text-slate-400 hover:bg-slate-700">고배당 & 금리 피봇</button>
            <button onclick="filterTheme('글로벌 방산 & 인프라', this)" class="tab-btn px-4 py-2 rounded-lg text-xs font-semibold bg-slate-800 text-slate-400 hover:bg-slate-700">글로벌 방산 & 인프라</button>
        </div>

        <!-- ETF 카드 그리드 -->
        <div id="etf-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-12">
            <div class="text-slate-400 col-span-full text-center py-12">데이터를 불러오고 있습니다...</div>
        </div>

        <!-- 마케팅 요약문 생성 섹션 -->
        <div class="bg-slate-800/90 border border-slate-700 p-6 rounded-2xl">
            <h3 class="text-lg font-bold text-white mb-2 flex items-center gap-2">
                <span>📝</span> 마케팅 리포트 요약문 자동 생성
            </h3>
            <p class="text-slate-400 text-xs mb-4">현재 테마별 핵심 성과 지표를 한눈에 볼 수 있는 블로그/SNS용 요약 문구입니다.</p>
            <textarea id="marketing-text" class="w-full h-36 bg-slate-900 border border-slate-700 rounded-xl p-3 text-xs text-slate-300 font-mono resize-none focus:outline-none" readonly></textarea>
            <button onclick="copyMarketingText()" class="mt-3 bg-slate-700 hover:bg-slate-600 text-white text-xs font-semibold px-4 py-2 rounded-lg transition flex items-center gap-1">
                📋 요약문 복사하기
            </button>
        </div>
    </div>

    <!-- 3. 개별 종목 상세 팝업 (모달) -->
    <div id="detail-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl w-full max-w-2xl overflow-hidden shadow-2xl">
            <!-- 모달 헤더 -->
            <div class="flex justify-between items-center p-6 border-b border-slate-700/60 bg-slate-800/50">
                <div>
                    <span id="modal-market" class="text-[10px] font-semibold border px-2 py-0.5 rounded-full"></span>
                    <h3 id="modal-title" class="text-xl font-bold text-white mt-1"></h3>
                    <p id="modal-ticker" class="text-xs text-slate-400 font-mono"></p>
                </div>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white p-2 rounded-lg bg-slate-700/50">
                    ✕
                </button>
            </div>

            <!-- 모달 바디 -->
            <div class="p-6 space-y-6 max-h-[80vh] overflow-y-auto">
                <!-- 개요 카드 정보 -->
                <div class="grid grid-cols-2 sm:grid-cols-3 gap-4">
                    <div class="bg-slate-900/60 p-3 rounded-xl border border-slate-700/40">
                        <span class="text-[11px] text-slate-400 block mb-1">현재가</span>
                        <span id="modal-price" class="text-lg font-bold font-mono text-white"></span>
                    </div>
                    <div class="bg-slate-900/60 p-3 rounded-xl border border-slate-700/40">
                        <span class="text-[11px] text-slate-400 block mb-1">1개월 수익률</span>
                        <span id="modal-return" class="text-lg font-bold font-mono"></span>
                    </div>
                    <div class="bg-slate-900/60 p-3 rounded-xl border border-slate-700/40 col-span-2 sm:col-span-1">
                        <span class="text-[11px] text-slate-400 block mb-1">투자 테마</span>
                        <span id="modal-theme" class="text-xs font-semibold text-blue-400"></span>
                    </div>
                </div>

                <!-- 상세 차트 -->
                <div class="bg-slate-900/40 p-4 rounded-xl border border-slate-700/40">
                    <h4 class="text-xs font-bold text-slate-300 mb-3">최근 30일 가격 추이</h4>
                    <div class="h-48 w-full">
                        <canvas id="modal-chart"></canvas>
                    </div>
                </div>

                <!-- 종목 전용 마케팅 요약문 -->
                <div class="bg-slate-900/80 p-4 rounded-xl border border-slate-700/60">
                    <h4 class="text-xs font-bold text-slate-300 mb-2">📣 이 종목 원클릭 마케팅 문구</h4>
                    <p id="modal-marketing-text" class="text-xs text-slate-300 font-mono bg-slate-950 p-3 rounded-lg mb-3 border border-slate-800 leading-relaxed"></p>
                    <button onclick="copyModalMarketingText()" class="w-full bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold py-2.5 rounded-lg transition flex items-center justify-center gap-1">
                        📋 종목 홍보문 복사하기
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let etfData = {};
        let modalChartInstance = null;

        function showDashboard() {
            document.getElementById('landing-page').classList.add('hidden');
            document.getElementById('dashboard-page').classList.remove('hidden');
            loadEtfData();
        }

        function showLanding() {
            document.getElementById('dashboard-page').classList.add('hidden');
            document.getElementById('landing-page').classList.remove('hidden');
        }

        function loadEtfData() {
            fetch('./data/etf_data.json')
                .then(res => res.json())
                .then(data => {
                    etfData = data;
                    renderCards('ALL');
                    generateMarketingSummary();
                })
                .catch(err => {
                    document.getElementById('etf-container').innerHTML = `<div class="text-rose-400 col-span-full text-center py-10">데이터 로드 실패: ${err.message}</div>`;
                });
        }

        function renderCards(selectedTheme) {
            const container = document.getElementById('etf-container');
            container.innerHTML = '';

            Object.keys(etfData).forEach(id => {
                const item = etfData[id];
                if (selectedTheme !== 'ALL' && item.theme !== selectedTheme) return;

                const isPositive = item.m1_return >= 0;
                const returnColor = isPositive ? 'text-rose-400' : 'text-sky-400';
                const marketBadge = item.market === 'KR' ? 'bg-red-500/20 text-red-300 border-red-500/30' : 'bg-blue-500/20 text-blue-300 border-blue-500/30';

                const card = document.createElement('div');
                card.className = 'bg-slate-800/80 rounded-xl p-5 shadow-xl border border-slate-700/60 hover:border-blue-500/80 hover:scale-[1.02] transition-all cursor-pointer';
                card.onclick = () => openModal(id);

                card.innerHTML = `
                    <div class="flex justify-between items-start mb-2">
                        <div>
                            <span class="text-[10px] font-semibold border px-2 py-0.5 rounded-full ${marketBadge}">${item.market}</span>
                            <h4 class="text-sm font-bold text-white mt-1.5">${item.name || item.ticker}</h4>
                        </div>
                        <span class="text-xs font-mono font-semibold px-2 py-1 rounded bg-slate-700 text-slate-200">${item.price}</span>
                    </div>
                    <div class="flex justify-between text-xs mb-3 pb-2 border-b border-slate-700/40">
                        <span class="text-slate-400">1개월 수익률</span>
                        <span class="font-bold ${returnColor}">${isPositive ? '+' : ''}${item.m1_return}%</span>
                    </div>
                    <div class="h-24 w-full"><canvas id="chart-${id}"></canvas></div>
                    <div class="text-right mt-2 text-[11px] text-blue-400 font-semibold">상세보기 &rarr;</div>
                `;
                container.appendChild(card);

                const ctx = document.getElementById(`chart-${id}`).getContext('2d');
                new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: item.history.map((_, i) => i + 1),
                        datasets: [{ data: item.history, borderColor: isPositive ? '#f43f5e' : '#38bdf8', borderWidth: 2, pointRadius: 0, fill: false }]
                    },
                    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { display: false }, y: { display: false } } }
                });
            });
        }

        function openModal(id) {
            const item = etfData[id];
            const isPositive = item.m1_return >= 0;

            document.getElementById('modal-title').innerText = item.name;
            document.getElementById('modal-ticker').innerText = item.ticker;
            document.getElementById('modal-price').innerText = item.price;
            document.getElementById('modal-theme').innerText = item.theme;

            const returnEl = document.getElementById('modal-return');
            returnEl.innerText = `${isPositive ? '+' : ''}${item.m1_return}%`;
            returnEl.className = `text-lg font-bold font-mono ${isPositive ? 'text-rose-400' : 'text-sky-400'}`;

            const marketEl = document.getElementById('modal-market');
            marketEl.innerText = item.market;
            marketEl.className = `text-[10px] font-semibold border px-2 py-0.5 rounded-full ${item.market === 'KR' ? 'bg-red-500/20 text-red-300 border-red-500/30' : 'bg-blue-500/20 text-blue-300 border-blue-500/30'}`;

            const mText = `[${item.market}] ${item.name} (${item.ticker})\n현재가: ${item.price} | 1개월 수익률: ${isPositive ? '+' : ''}${item.m1_return}%\n주요 테마: ${item.theme}\n📌 상세 대시보드 확인: Bustoken.github.io`;
            document.getElementById('modal-marketing-text').innerText = mText;

            // 모달 차트 렌더링
            if (modalChartInstance) modalChartInstance.destroy();
            const ctx = document.getElementById('modal-chart').getContext('2d');
            modalChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: item.history.map((_, i) => `${i + 1}일전`),
                    datasets: [{
                        label: '종가',
                        data: item.history,
                        borderColor: isPositive ? '#f43f5e' : '#38bdf8',
                        backgroundColor: isPositive ? 'rgba(244, 63, 94, 0.1)' : 'rgba(56, 189, 248, 0.1)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { grid: { color: '#334155' }, ticks: { color: '#94a3b8', font: { size: 10 } } },
                        y: { grid: { color: '#334155' }, ticks: { color: '#94a3b8', font: { size: 10 } } }
                    }
                }
            });

            document.getElementById('detail-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('detail-modal').classList.add('hidden');
        }

        function filterTheme(themeName, btnElement) {
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.className = 'tab-btn px-4 py-2 rounded-lg text-xs font-semibold bg-slate-800 text-slate-400 hover:bg-slate-700';
            });
            btnElement.className = 'tab-btn px-4 py-2 rounded-lg text-xs font-semibold bg-blue-600 text-white';
            renderCards(themeName);
        }

        function generateMarketingSummary() {
            let summary = `[Bustoken ETF Research - 오늘의 테마 동향]\n\n`;
            Object.keys(etfData).forEach(id => {
                const item = etfData[id];
                summary += `• [${item.market}] ${item.name}: ${item.price} (1M: ${item.m1_return >= 0 ? '+' : ''}${item.m1_return}%)\n`;
            });
            summary += `\n📌 상세 대시보드: Bustoken.github.io`;
            document.getElementById('marketing-text').value = summary;
        }

        function copyMarketingText() {
            const copyText = document.getElementById("marketing-text");
            copyText.select();
            navigator.clipboard.writeText(copyText.value);
            alert("전체 마케팅 요약문이 복사되었습니다!");
        }

        function copyModalMarketingText() {
            const text = document.getElementById("modal-marketing-text").innerText;
            navigator.clipboard.writeText(text);
            alert("해당 종목 마케팅 문구가 복사되었습니다!");
        }
    </script>
</body>
</html>
