<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bustoken ETF Research</title>
    <!-- Tailwind CSS 및 Chart.js 라이브러리 불러오기 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-center items-center p-4">

    <!-- 1. 랜딩 페이지 (첫 화면) -->
    <div id="landing-page" class="bg-slate-800 p-8 sm:p-10 rounded-2xl shadow-2xl text-center max-w-lg w-full border border-slate-700 transition-all duration-500">
        <span class="inline-block bg-sky-900/80 text-sky-400 border border-sky-500/30 px-3 py-1 rounded-full text-xs font-semibold mb-4 tracking-wide uppercase">
            ● Live Platform
        </span>
        <h1 class="text-2xl sm:text-3xl font-bold text-white mb-3">Bustoken's Lab</h1>
        <p class="text-slate-400 text-sm sm:text-base leading-relaxed mb-6">
            GitHub Pages 기반의 ETF 리서치 플랫폼입니다.<br>
            매일 자동 업데이트되는 데이터 기반의 테마별 포트폴리오 인사이트를 확인해 보세요.
        </p>
        <button onclick="showDashboard()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 px-6 rounded-xl transition duration-200 shadow-lg shadow-blue-500/20 active:scale-95 flex items-center justify-center gap-2">
            <span>대시보드 입장하기</span>
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"></path>
            </svg>
        </button>
    </div>

    <!-- 2. ETF 대시보드 화면 (처음에는 숨김 처리) -->
    <div id="dashboard-page" class="hidden w-full max-w-6xl mx-auto py-6">
        <!-- 대시보드 상단 헤더 -->
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-8 gap-4 border-b border-slate-800 pb-5">
            <div>
                <div class="flex items-center gap-2 mb-1">
                    <span class="bg-blue-500/10 text-blue-400 text-xs px-2.5 py-0.5 rounded-full border border-blue-500/20 font-mono">Bustoken Research</span>
                    <h2 class="text-2xl font-bold text-white">ETF Market Insight Dashboard</h2>
                </div>
                <p class="text-slate-400 text-sm">Python 스크립트와 GitHub Actions로 매일 갱신되는 시장 지표 및 테마 추세</p>
            </div>
            <button onclick="showLanding()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-2 rounded-lg border border-slate-700 transition flex items-center gap-1">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                </svg>
                홈으로 돌아가기
            </button>
        </div>

        <!-- ETF 카드 목록이 자동으로 삽입될 컨테이너 -->
        <div id="etf-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="text-slate-400 col-span-full text-center py-12">ETF 데이터를 불러오고 있습니다...</div>
        </div>
    </div>

    <script>
        // 랜딩 -> 대시보드 전환 함수
        function showDashboard() {
            document.getElementById('landing-page').classList.add('hidden');
            document.getElementById('dashboard-page').classList.remove('hidden');
            loadEtfData(); // 대시보드로 넘어올 때 데이터 로드
        }

        // 대시보드 -> 랜딩 전환 함수
        function showLanding() {
            document.getElementById('dashboard-page').classList.add('hidden');
            document.getElementById('landing-page').classList.remove('hidden');
        }

        // JSON 데이터 불러오기 및 카드 렌더링
        let isLoaded = false;
        function loadEtfData() {
            if (isLoaded) return; // 중복 로딩 방지

            fetch('./data/etf_data.json')
                .then(response => response.json())
                .then(data => {
                    const container = document.getElementById('etf-container');
                    container.innerHTML = '';

                    Object.keys(data).forEach(ticker => {
                        const item = data[ticker];
                        const isPositive = item.m1_return >= 0;
                        const returnColor = isPositive ? 'text-rose-400' : 'text-sky-400';
                        const returnSign = isPositive ? '+' : '';

                        const card = document.createElement('div');
                        card.className = 'bg-slate-800/80 backdrop-blur rounded-xl p-5 shadow-xl border border-slate-700/60 hover:border-blue-500/50 transition-all duration-300';
                        
                        card.innerHTML = `
                            <div class="flex justify-between items-center mb-3">
                                <div class="flex items-center gap-2">
                                    <span class="text-xl font-bold tracking-wider text-white">${ticker}</span>
                                </div>
                                <span class="text-xs font-mono font-semibold px-2.5 py-1 rounded-md bg-slate-700/80 text-slate-200 border border-slate-600/50">$${item.price}</span>
                            </div>
                            <div class="flex justify-between text-xs mb-4 pb-2 border-b border-slate-700/40">
                                <span class="text-slate-400">1개월 수익률</span>
                                <span class="font-bold ${returnColor}">${returnSign}${item.m1_return}%</span>
                            </div>
                            <div class="h-28 w-full">
                                <canvas id="chart-${ticker}"></canvas>
                            </div>
                        `;

                        container.appendChild(card);

                        // 차트 렌더링
                        const ctx = document.getElementById(`chart-${ticker}`).getContext('2d');
                        new Chart(ctx, {
                            type: 'line',
                            data: {
                                labels: item.history.map((_, i) => i + 1),
                                datasets: [{
                                    data: item.history,
                                    borderColor: isPositive ? '#f43f5e' : '#38bdf8',
                                    borderWidth: 2,
                                    pointRadius: 0,
                                    fill: false,
                                    tension: 0.2
                                }]
                            },
                            options: {
                                responsive: true,
                                maintainAspectRatio: false,
                                plugins: { legend: { display: false } },
                                scales: {
                                    x: { display: false },
                                    y: { display: false }
                                }
                            }
                        });
                    });
                    isLoaded = true;
                })
                .catch(err => {
                    document.getElementById('etf-container').innerHTML = 
                        `<div class="text-rose-400 col-span-full text-center py-10">데이터를 불러오는 중 오류가 발생했습니다. (${err.message})</div>`;
                });
        }
    </script>
</body>
</html>
