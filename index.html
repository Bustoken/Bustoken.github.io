<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bustoken ETF Research Platform</title>
    <!-- Web Fonts -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { 
            font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; 
            background-color: #0f172a; 
            color: #ffffff; 
        }
        .font-brand { font-family: 'Plus Jakarta Sans', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-center items-center p-4">

    <!-- 1. 랜딩 페이지 -->
    <div id="landing-page" class="bg-slate-800/90 backdrop-blur p-8 sm:p-10 rounded-2xl shadow-2xl text-center max-w-lg w-full border border-slate-700/80">
        <span class="inline-flex items-center gap-1.5 bg-sky-950/80 text-sky-400 border border-sky-500/30 px-3 py-1 rounded-full text-xs font-bold mb-4 tracking-wider uppercase font-mono">
            <i data-lucide="activity" class="w-3.5 h-3.5"></i> Live Platform
        </span>
        <h1 class="font-brand text-2xl sm:text-3xl font-extrabold text-white tracking-tight mb-3">Bustoken ETF Research</h1>
        <p class="text-slate-300 text-sm sm:text-base leading-relaxed mb-6 font-normal">
            국내외 ETF 시장 동향 수집 및 테마별 포트폴리오 기획·마케팅 플랫폼입니다.
        </p>
        <button onclick="showDashboard()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3.5 px-6 rounded-xl transition shadow-lg shadow-blue-500/25 active:scale-95 flex items-center justify-center gap-2 text-sm tracking-wide">
            <span>플랫폼 입장하기</span>
            <i data-lucide="arrow-right" class="w-4 h-4"></i>
        </button>
    </div>

    <!-- 2. ETF 대시보드 레이아웃 -->
    <div id="dashboard-page" class="hidden w-full max-w-7xl mx-auto py-4 flex flex-col md:flex-row gap-6">
        
        <!-- 좌측 사이드바 -->
        <aside class="w-full md:w-64 bg-slate-800/90 border border-slate-700/80 rounded-2xl p-5 flex flex-col justify-between shrink-0">
            <div>
                <div class="mb-6 pb-4 border-b border-slate-700/60">
                    <span class="bg-blue-500/10 text-blue-400 text-[10px] font-bold px-2.5 py-1 rounded-full border border-blue-500/20 font-mono tracking-wider uppercase">Bustoken Research</span>
                    <h2 class="font-brand text-lg font-bold text-white mt-2 tracking-tight">ETF Marketing Lab</h2>
                </div>
                
                <nav class="space-y-1.5">
                    <a href="index.html" class="flex items-center gap-2.5 px-3.5 py-2.5 rounded-xl text-xs font-bold bg-blue-600 text-white transition">
                        <i data-lucide="layout-dashboard" class="w-4 h-4"></i> 테마 포트폴리오
                    </a>
                    <a href="analytics.html" class="flex items-center gap-2.5 px-3.5 py-2.5 rounded-xl text-xs font-semibold text-slate-400 hover:bg-slate-700/60 hover:text-white transition">
                        <i data-lucide="line-chart" class="w-4 h-4"></i> 종목 심층 분석
                    </a>
                    <a href="report.html" class="flex items-center gap-2.5 px-3.5 py-2.5 rounded-xl text-xs font-semibold text-slate-400 hover:bg-slate-700/60 hover:text-white transition">
                        <i data-lucide="file-text" class="w-4 h-4"></i> 마케팅 리포트
                    </a>
                </nav>
            </div>

            <div class="pt-4 border-t border-slate-700/60 mt-6">
                <button onclick="showLanding()" class="w-full text-xs font-semibold bg-slate-900 hover:bg-slate-700 text-slate-300 py-2.5 rounded-xl border border-slate-700/80 transition flex items-center justify-center gap-1.5">
                    <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i> 홈으로 이동
                </button>
            </div>
        </aside>

        <!-- 우측 메인 영역 -->
        <main class="flex-1 min-w-0">
            <div class="mb-5">
                <h3 class="text-xl font-bold text-white tracking-tight">테마별 ETF 포트폴리오</h3>
                <p class="text-xs text-slate-400 mt-1">실시간 수집된 국내외 주요 테마 ETF의 수익률 및 차트 현황입니다.</p>
            </div>

            <!-- 테마 필터 탭 -->
            <div class="flex gap-2 mb-6 overflow-x-auto pb-2" id="theme-tabs">
                <button onclick="filterTheme('ALL', this)" class="tab-btn px-4 py-2 rounded-lg text-xs font-bold bg-blue-600 text-white flex items-center gap-1.5 shrink-0">
                    <i data-lucide="layers" class="w-3.5 h-3.5"></i> 전체 보기
                </button>
                <button onclick="filterTheme('AI & 반도체/전력', this)" class="tab-btn px-4 py-2 rounded-lg text-xs font-semibold bg-slate-800 text-slate-400 hover:bg-slate-700 flex items-center gap-1.5 shrink-0">
                    <i data-lucide="cpu" class="w-3.5 h-3.5"></i> AI & 반도체/전력
                </button>
                <button onclick="filterTheme('고배당 & 금리 피봇', this)" class="tab-btn px-4 py-2 rounded-lg text-xs font-semibold bg-slate-800 text-slate-400 hover:bg-slate-700 flex items-center gap-1.5 shrink-0">
                    <i data-lucide="coins" class="w-3.5 h-3.5"></i> 고배당 & 금리 피봇
                </button>
                <button onclick="filterTheme('글로벌 방산 & 인프라', this)" class="tab-btn px-4 py-2 rounded-lg text-xs font-semibold bg-slate-800 text-slate-400 hover:bg-slate-700 flex items-center gap-1.5 shrink-0">
                    <i data-lucide="shield" class="w-3.5 h-3.5"></i> 글로벌 방산 & 인프라
                </button>
            </div>

            <div id="etf-container" class="grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 gap-5">
                <div class="text-slate-400 col-span-full text-center py-12">데이터를 불러오고 있습니다...</div>
            </div>
        </main>
    </div>

    <!-- 개별 종목 상세 팝업 (모달) -->
    <div id="detail-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl w-full max-w-2xl overflow-hidden shadow-2xl">
            <div class="flex justify-between items-center p-6 border-b border-slate-700/60 bg-slate-800/50">
                <div>
                    <span id="modal-market" class="text-[10px] font-mono font-bold border px-2 py-0.5 rounded-full"></span>
                    <h3 id="modal-title" class="text-xl font-bold text-white mt-1.5 tracking-tight"></h3>
                    <p id="modal-ticker" class="text-xs text-slate-400 font-mono mt-0.5"></p>
                </div>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white p-2 rounded-lg bg-slate-700/50">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <div class="p-6 space-y-6 max-h-[80vh] overflow-y-auto">
                <div class="grid grid-cols-2 sm:grid-cols-3 gap-4">
                    <div class="bg-slate-900/60 p-3.5 rounded-xl border border-slate-700/40">
                        <span class="text-[11px] text-slate-400 block mb-1">현재가</span>
                        <span id="modal-price" class="text-lg font-bold font-mono text-white"></span>
                    </div>
                    <div class="bg-slate-900/60 p-3.5 rounded-xl border border-slate-700/40">
                        <span class="text-[11px] text-slate-400 block mb-1">1개월 수익률</span>
                        <span id="modal-return" class="text-lg font-bold font-mono"></span>
                    </div>
                    <div class="bg-slate-900/60 p-3.5 rounded-xl border border-slate-700/40 col-span-2 sm:col-span-1">
                        <span class="text-[11px] text-slate-400 block mb-1">투자 테마</span>
                        <span id="modal-theme" class="text-xs font-semibold text-blue-400"></span>
                    </div>
                </div>

                <div class="bg-slate-900/40 p-4 rounded-xl border border-slate-700/40">
                    <h4 class="text-xs font-bold text-slate-300 mb-3 flex items-center gap-1.5">
                        <i data-lucide="trending-up" class="w-4 h-4 text-slate-400"></i> 최근 30일 가격 추이
                    </h4>
                    <div class="h-48 w-full">
                        <canvas id="modal-chart"></canvas>
                    </div>
                </div>

                <div class="bg-slate-900/80 p-4 rounded-xl border border-slate-700/60">
                    <h4 class="text-xs font-bold text-slate-300 mb-2 flex items-center gap-1.5">
                        <i data-lucide="megaphones" class="w-4 h-4 text-blue-400"></i> 이 종목 원클릭 마케팅 문구
                    </h4>
                    <p id="modal-marketing-text" class="text-xs text-slate-300 font-mono bg-slate-950 p-3.5 rounded-lg mb-3 border border-slate-800 leading-relaxed"></p>
                    <button onclick="copyModalMarketingText()" class="w-full bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold py-2.5 rounded-lg transition flex items-center justify-center gap-1.5">
                        <i data-lucide="copy" class="w-3.5 h-3.5"></i> 종목 홍보문 복사하기
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let etfData = {};
        let modalChartInstance = null;

        function refreshIcons() { lucide.createIcons(); }

        function showDashboard() {
            document.getElementById('landing-page').classList.add('hidden');
            document.getElementById('dashboard-page').classList.remove('hidden');
            loadEtfData();
        }

        function showLanding() {
            document.getElementById('dashboard-page').classList.add('hidden');
            document.getElementById('landing-page').classList.remove('hidden');
        }

        function loadEtfData() {
            fetch('./data/etf_data.json')
                .then(res => res.json())
                .then(data => {
                    etfData = data;
                    renderCards('ALL');
                })
                .catch(err => {
                    document.getElementById('etf-container').innerHTML = `<div class="text-rose-400 col-span-full text-center py-10 font-mono text-xs">데이터 로드 실패: ${err.message}</div>`;
                });
        }

        function renderCards(selectedTheme) {
            const container = document.getElementById('etf-container');
            container.innerHTML = '';

            Object.keys(etfData).forEach(id => {
                const item = etfData[id];
                if (selectedTheme !== 'ALL' && item.theme !== selectedTheme) return;

                const isPositive = item.m1_return >= 0;
                const returnColor = isPositive ? 'text-rose-400' : 'text-sky-400';
                const marketBadge = item.market === 'KR' ? 'bg-red-500/20 text-red-300 border-red-500/30' : 'bg-blue-500/20 text-blue-300 border-blue-500/30';

                const card = document.createElement('div');
                card.className = 'bg-slate-800/80 rounded-xl p-5 shadow-xl border border-slate-700/60 hover:border-blue-500/80 hover:scale-[1.02] transition-all cursor-pointer';
                card.onclick = () => openModal(id);

                card.innerHTML = `
                    <div class="flex justify-between items-start mb-2">
                        <div>
                            <span class="text-[10px] font-mono font-bold border px-2 py-0.5 rounded-full ${marketBadge}">${item.market}</span>
                            <h4 class="text-sm font-bold text-white mt-1.5 tracking-tight">${item.name || item.ticker}</h4>
                        </div>
                        <span class="text-xs font-mono font-bold px-2 py-1 rounded bg-slate-700/80 text-slate-200">${item.price}</span>
                    </div>
                    <div class="flex justify-between text-xs mb-3 pb-2 border-b border-slate-700/40">
                        <span class="text-slate-400 font-normal">1개월 수익률</span>
                        <span class="font-mono font-bold ${returnColor}">${isPositive ? '+' : ''}${item.m1_return}%</span>
                    </div>
                    <div class="h-24 w-full"><canvas id="chart-${id}"></canvas></div>
                    <div class="text-right mt-2 text-[11px] text-blue-400 font-bold flex items-center justify-end gap-1">
                        상세보기 <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
                    </div>
                `;
                container.appendChild(card);

                const ctx = document.getElementById(`chart-${id}`).getContext('2d');
                new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: item.history.map((_, i) => i + 1),
                        datasets: [{ data: item.history, borderColor: isPositive ? '#f43f5e' : '#38bdf8', borderWidth: 2, pointRadius: 0, fill: false }]
                    },
                    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { display: false }, y: { display: false } } }
                });
            });

            refreshIcons();
        }

        function openModal(id) {
            const item = etfData[id];
            const isPositive = item.m1_return >= 0;

            document.getElementById('modal-title').innerText = item.name;
            document.getElementById('modal-ticker').innerText = item.ticker;
            document.getElementById('modal-price').innerText = item.price;
            document.getElementById('modal-theme').innerText = item.theme;

            const returnEl = document.getElementById('modal-return');
            returnEl.innerText = `${isPositive ? '+' : ''}${item.m1_return}%`;
            returnEl.className = `text-lg font-bold font-mono ${isPositive ? 'text-rose-400' : 'text-sky-400'}`;

            const marketEl = document.getElementById('modal-market');
            marketEl.innerText = item.market;
            marketEl.className = `text-[10px] font-mono font-bold border px-2 py-0.5 rounded-full ${item.market === 'KR' ? 'bg-red-500/20 text-red-300 border-red-500/30' : 'bg-blue-500/20 text-blue-300 border-blue-500/30'}`;

            const mText = `[${item.market}] ${item.name} (${item.ticker})\n현재가: ${item.price} | 1개월 수익률: ${isPositive ? '+' : ''}${item.m1_return}%\n주요 테마: ${item.theme}\n📌 상세 대시보드 확인: Bustoken.github.io`;
            document.getElementById('modal-marketing-text').innerText = mText;

            if (modalChartInstance) modalChartInstance.destroy();
            const ctx = document.getElementById('modal-chart').getContext('2d');
            modalChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: item.history.map((_, i) => `${i + 1}일전`),
                    datasets: [{
                        label: '종가',
                        data: item.history,
                        borderColor: isPositive ? '#f43f5e' : '#38bdf8',
                        backgroundColor: isPositive ? 'rgba(244, 63, 94, 0.1)' : 'rgba(56, 189, 248, 0.1)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { grid: { color: '#334155' }, ticks: { color: '#94a3b8', font: { family: 'JetBrains Mono', size: 10 } } },
                        y: { grid: { color: '#334155' }, ticks: { color: '#94a3b8', font: { family: 'JetBrains Mono', size: 10 } } }
                    }
                }
            });

            document.getElementById('detail-modal').classList.remove('hidden');
            refreshIcons();
        }

        function closeModal() { document.getElementById('detail-modal').classList.add('hidden'); }

        function filterTheme(themeName, btnElement) {
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.className = 'tab-btn px-4 py-2 rounded-lg text-xs font-semibold bg-slate-800 text-slate-400 hover:bg-slate-700 flex items-center gap-1.5 shrink-0';
            });
            btnElement.className = 'tab-btn px-4 py-2 rounded-lg text-xs font-bold bg-blue-600 text-white flex items-center gap-1.5 shrink-0';
            renderCards(themeName);
        }

        function copyModalMarketingText() {
            const text = document.getElementById("modal-marketing-text").innerText;
            navigator.clipboard.writeText(text);
            alert("해당 종목 마케팅 문구가 복사되었습니다!");
        }

        refreshIcons();
    </script>
</body>
</html>
