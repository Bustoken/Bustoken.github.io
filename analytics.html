<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>종목 심층 분석 - Bustoken ETF Research</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #0f172a; color: #ffffff; }
    </style>
</head>
<body class="min-h-screen p-4 flex justify-center items-start">
    <div class="w-full max-w-7xl mx-auto py-4 flex flex-col md:flex-row gap-6">
        
        <!-- 좌측 사이드바 -->
        <aside class="w-full md:w-64 bg-slate-800/90 border border-slate-700/80 rounded-2xl p-5 flex flex-col justify-between shrink-0">
            <div>
                <div class="mb-6 pb-4 border-b border-slate-700/60">
                    <span class="bg-blue-500/10 text-blue-400 text-[11px] px-2.5 py-0.5 rounded-full border border-blue-500/20 font-mono">Bustoken Research</span>
                    <h2 class="text-lg font-bold text-white mt-2">ETF Marketing Lab</h2>
                </div>
                
                <nav class="space-y-1.5">
                    <a href="index.html" class="flex items-center gap-2.5 px-3.5 py-2.5 rounded-xl text-xs font-semibold text-slate-400 hover:bg-slate-700/60 hover:text-white transition">
                        <i data-lucide="layout-dashboard" class="w-4 h-4"></i> 테마 포트폴리오
                    </a>
                    <a href="analytics.html" class="flex items-center gap-2.5 px-3.5 py-2.5 rounded-xl text-xs font-semibold bg-blue-600 text-white transition">
                        <i data-lucide="line-chart" class="w-4 h-4"></i> 종목 심층 분석
                    </a>
                    <a href="report.html" class="flex items-center gap-2.5 px-3.5 py-2.5 rounded-xl text-xs font-semibold text-slate-400 hover:bg-slate-700/60 hover:text-white transition">
                        <i data-lucide="file-text" class="w-4 h-4"></i> 마케팅 리포트
                    </a>
                </nav>
            </div>

            <div class="pt-4 border-t border-slate-700/60 mt-6">
                <a href="index.html" class="w-full text-xs bg-slate-900 hover:bg-slate-700 text-slate-300 py-2.5 rounded-xl border border-slate-700/80 transition flex items-center justify-center gap-1.5">
                    <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i> 메인으로 돌아가기
                </a>
            </div>
        </aside>

        <!-- 메인 콘텐츠 영역 -->
        <main class="flex-1 min-w-0">
            <div class="mb-5">
                <h3 class="text-xl font-bold text-white">종목 심층 분석 & 매트릭스</h3>
                <p class="text-xs text-slate-400">전체 ETF 수집 종목의 정량 지표와 테마 간 비교 데이터입니다.</p>
            </div>

            <div class="bg-slate-800/80 border border-slate-700 p-6 rounded-2xl">
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-xs">
                        <thead class="bg-slate-900/60 text-slate-400 border-b border-slate-700">
                            <tr>
                                <th class="p-3">구분</th>
                                <th class="p-3">종목명</th>
                                <th class="p-3">티커</th>
                                <th class="p-3">투자 테마</th>
                                <th class="p-3 text-right">현재가</th>
                                <th class="p-3 text-right">1M 수익률</th>
                            </tr>
                        </thead>
                        <tbody id="analytics-table" class="divide-y divide-slate-700/40 text-slate-200">
                            <tr><td colspan="6" class="text-center py-8 text-slate-400">데이터를 불러오는 중입니다...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
        lucide.createIcons();
        fetch('./data/etf_data.json')
            .then(res => res.json())
            .then(data => {
                const tbody = document.getElementById('analytics-table');
                tbody.innerHTML = '';
                Object.keys(data).forEach(id => {
                    const item = data[id];
                    const isPositive = item.m1_return >= 0;
                    const row = document.createElement('tr');
                    row.className = 'hover:bg-slate-700/30 transition';
                    row.innerHTML = `
                        <td class="p-3"><span class="px-2 py-0.5 text-[10px] rounded font-semibold ${item.market==='KR'?'bg-red-500/20 text-red-300':'bg-blue-500/20 text-blue-300'}">${item.market}</span></td>
                        <td class="p-3 font-semibold text-white">${item.name}</td>
                        <td class="p-3 font-mono text-slate-400">${item.ticker}</td>
                        <td class="p-3 text-blue-400">${item.theme}</td>
                        <td class="p-3 text-right font-mono">${item.price}</td>
                        <td class="p-3 text-right font-mono font-bold ${isPositive?'text-rose-400':'text-sky-400'}">${isPositive?'+':''}${item.m1_return}%</td>
                    `;
                    tbody.appendChild(row);
                });
            });
    </script>
</body>
</html>
