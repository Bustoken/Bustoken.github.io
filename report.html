<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마케팅 리포트 - Bustoken ETF Research</title>
    <!-- Web Fonts -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { 
            font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; 
            background-color: #0f172a; 
            color: #ffffff; 
        }
        .font-brand { font-family: 'Plus Jakarta Sans', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
    </style>
</head>
<body class="min-h-screen p-4 flex justify-center items-start">
    <div class="w-full max-w-7xl mx-auto py-4 flex flex-col md:flex-row gap-6">
        
        <!-- 좌측 사이드바 -->
        <aside class="w-full md:w-64 bg-slate-800/90 border border-slate-700/80 rounded-2xl p-5 flex flex-col justify-between shrink-0">
            <div>
                <div class="mb-6 pb-4 border-b border-slate-700/60">
                    <span class="bg-blue-500/10 text-blue-400 text-[10px] font-bold px-2.5 py-1 rounded-full border border-blue-500/20 font-mono tracking-wider uppercase">Bustoken Research</span>
                    <h2 class="font-brand text-lg font-bold text-white mt-2 tracking-tight">ETF Marketing Lab</h2>
                </div>
                
                <nav class="space-y-1.5">
                    <a href="index.html" class="flex items-center gap-2.5 px-3.5 py-2.5 rounded-xl text-xs font-semibold text-slate-400 hover:bg-slate-700/60 hover:text-white transition">
                        <i data-lucide="layout-dashboard" class="w-4 h-4"></i> 테마 포트폴리오
                    </a>
                    <a href="analytics.html" class="flex items-center gap-2.5 px-3.5 py-2.5 rounded-xl text-xs font-semibold text-slate-400 hover:bg-slate-700/60 hover:text-white transition">
                        <i data-lucide="line-chart" class="w-4 h-4"></i> 종목 심층 분석
                    </a>
                    <a href="report.html" class="flex items-center gap-2.5 px-3.5 py-2.5 rounded-xl text-xs font-bold bg-blue-600 text-white transition">
                        <i data-lucide="file-text" class="w-4 h-4"></i> 마케팅 리포트
                    </a>
                </nav>
            </div>

            <div class="pt-4 border-t border-slate-700/60 mt-6">
                <a href="index.html" class="w-full text-xs font-semibold bg-slate-900 hover:bg-slate-700 text-slate-300 py-2.5 rounded-xl border border-slate-700/80 transition flex items-center justify-center gap-1.5">
                    <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i> 메인으로 돌아가기
                </a>
            </div>
        </aside>

        <!-- 메인 콘텐츠 영역 -->
        <main class="flex-1 min-w-0">
            <div class="mb-5">
                <h3 class="text-xl font-bold text-white tracking-tight">마케팅 요약 리포트 생성기</h3>
                <p class="text-xs text-slate-400 mt-1">블로그, SNS, 고객용 브리핑 텍스트를 원클릭으로 추출할 수 있습니다.</p>
            </div>

            <div class="bg-slate-800/90 border border-slate-700 p-6 rounded-2xl shadow-xl">
                <h4 class="text-xs font-bold text-slate-300 mb-3 flex items-center gap-2">
                    <i data-lucide="sparkles" class="w-4 h-4 text-blue-400"></i> 전체 테마 요약 브리핑 문구
                </h4>
                <textarea id="marketing-text" class="w-full h-60 bg-slate-950 border border-slate-800 rounded-xl p-4 text-xs text-slate-300 font-mono leading-relaxed resize-none focus:outline-none mb-4" readonly></textarea>
                <button onclick="copyMarketingText()" class="bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold px-4 py-2.5 rounded-lg transition flex items-center gap-1.5">
                    <i data-lucide="copy" class="w-3.5 h-3.5"></i> 브리핑 문구 복사하기
                </button>
            </div>
        </main>
    </div>

    <script>
        lucide.createIcons();
        fetch('./data/etf_data.json')
            .then(res => res.json())
            .then(data => {
                let summary = `[Bustoken ETF Research - 오늘의 테마 브리핑]\n\n`;
                Object.keys(data).forEach(id => {
                    const item = data[id];
                    summary += `• [${item.market}] ${item.name}: ${item.price} (1M: ${item.m1_return >= 0 ? '+' : ''}${item.m1_return}%)\n`;
                });
                summary += `\n📌 상세 대시보드: Bustoken.github.io`;
                document.getElementById('marketing-text').value = summary;
            });

        function copyMarketingText() {
            const copyText = document.getElementById("marketing-text");
            copyText.select();
            navigator.clipboard.writeText(copyText.value);
            alert("마케팅 브리핑 문구가 복사되었습니다!");
        }
    </script>
</body>
</html>
